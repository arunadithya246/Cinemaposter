<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kollywood Nights — Now Showing</title>
<style>
  :root{
    --bg: #0e0d10;
    --card: #17151a;
    --gold: #e3a94c;
    --red: #c1272d;
    --text: #f2ede4;
    --muted: #a79f95;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    padding: 40px 20px 60px;
  }

  header{
    text-align:center;
    margin-bottom: 40px;
  }

  header .eyebrow{
    color: var(--gold);
    letter-spacing: 3px;
    font-size: 13px;
    text-transform: uppercase;
    font-weight: 600;
  }

  header h1{
    font-size: 40px;
    margin-top: 8px;
    font-weight: 800;
    letter-spacing: 1px;
  }

  header p{
    color: var(--muted);
    margin-top: 8px;
    font-size: 15px;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .poster{
    background: var(--card);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #2a2730;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .poster:hover{
    transform: translateY(-6px);
    box-shadow: 0 12px 24px rgba(0,0,0,0.5);
  }

  .art{
    height: 280px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 20px;
    position: relative;
  }

  .art::after{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(to top, rgba(0,0,0,0.55), transparent 60%);
  }

  .art h2{
    position: relative;
    z-index: 1;
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    line-height: 1.2;
  }

  .info{
    padding: 16px 18px 20px;
    display:flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .tag{
    display:inline-block;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
  }

  .meta{
    color: var(--muted);
    font-size: 13px;
  }

  .btn{
    margin-top: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--red);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
    width: 100%;
  }

  .btn:hover{
    background: #a31f24;
  }

  .btn:active{
    transform: scale(0.97);
  }

  @media (max-width: 480px){
    header h1{ font-size: 30px; }
    .art{ height: 220px; }
  }
</style>
</head>
<body>

  <header>
    <div class="eyebrow">Now Showing</div>
    <h1>Kollywood Nights</h1>
    <p>A weekend lineup of Tamil cinema, all under one roof.</p>
  </header>

  <div class="grid">

    <div class="poster">
      <div class="art" style="background: linear-gradient(160deg, #7a1f1f, #2b0a0a);">
        <h2>Kaadu Vetri</h2>
      </div>
      <div class="info">
        <span class="tag">Action</span>
        <span class="meta">2h 38m · U/A</span>
        <button class="btn">▶ Watch Trailer</button>
      </div>
    </div>

    <div class="poster">
      <div class="art" style="background: linear-gradient(160deg, #1f3a5f, #0a1420);">
        <h2>Nizhal Yaathirai</h2>
      </div>
      <div class="info">
        <span class="tag">Thriller</span>
        <span class="meta">2h 15m · U/A</span>
        <button class="btn">▶ Watch Trailer</button>
      </div>
    </div>

    <div class="poster">
      <div class="art" style="background: linear-gradient(160deg, #6b4c1f, #241a0a);">
        <h2>Vaanam Pesuthu</h2>
      </div>
      <div class="info">
        <span class="tag">Drama</span>
        <span class="meta">2h 20m · U</span>
        <button class="btn">▶ Watch Trailer</button>
      </div>
    </div>

    <div class="poster">
      <div class="art" style="background: linear-gradient(160deg, #4a1f5f, #170a20);">
        <h2>Theeyanam</h2>
      </div>
      <div class="info">
        <span class="tag">Action</span>
        <span class="meta">2h 45m · U/A</span>
        <button class="btn">▶ Watch Trailer</button>
      </div>
    </div>

    <div class="poster">
      <div class="art" style="background: linear-gradient(160deg, #1f5f4a, #0a2017);">
        <h2>Mannin Kural</h2>
      </div>
      <div class="info">
        <span class="tag">Family Drama</span>
        <span class="meta">2h 30m · U</span>
        <button class="btn">▶ Watch Trailer</button>
      </div>
    </div>

    <div class="poster">
      <div class="art" style="background: linear-gradient(160deg, #5f1f3a, #200a14);">
        <h2>Vizhi Oram</h2>
      </div>
      <div class="info">
        <span class="tag">Romance</span>
        <span class="meta">2h 10m · U</span>
        <button class="btn">▶ Watch Trailer</button>
      </div>
    </div>

  </div>

<script>
  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const title = btn.closest('.poster').querySelector('h2').textContent;
      btn.textContent = '✓ Playing "' + title + '"';
      setTimeout(() => { btn.textContent = '▶ Watch Trailer'; }, 1500);
    });
  });
</script>

</body>
</html>
