<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kollywood Cinema Posters</title>
  <!-- Link to External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Kollywood Movies</h1>
    <p>Select a movie to watch</p>
  </header>

  <div class="grid">

    <!-- Vijay Poster -->
    <div class="poster">
      <img src="master.jpg" alt="Master Movie Poster">
      <div class="info">
        <h2>Master</h2>
        <p class="actor">Starring: Thalapathy Vijay</p>
        <button class="btn">Watch Trailer</button>
      </div>
    </div>

    <!-- Suriya Poster -->
    <div class="poster">
      <img src="sp.jpg" alt="Soorarai Pottru Poster">
      <div class="info">
        <h2>Soorarai Pottru</h2>
        <p class="actor">Starring: Suriya</p>
        <button class="btn">Watch Trailer</button>
      </div>
    </div>

    <!-- Ajith Poster -->
    <div class="poster">
      <img src="thunivu.jpg" alt="Thunivu Poster">
      <div class="info">
        <h2>Thunivu</h2>
        <p class="actor">Starring: Ajith Kumar</p>
        <button class="btn">Watch Trailer</button>
      </div>
    </div>

    <!-- Dhanush Poster -->
    <div class="poster">
      <img src="asuran.jpg" alt="Asuran Poster">
      <div class="info">
        <h2>Asuran</h2>
        <p class="actor">Starring: Dhanush</p>
        <button class="btn">Watch Trailer</button>
      </div>
    </div>

  </div>

</body>
</html>
